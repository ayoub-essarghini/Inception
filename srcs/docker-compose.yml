services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    ports:
      - 3306:3306
    networks:
      - inception-network
    volumes:
      - DB:/var/lib/mysql
    restart: always

  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    ports:
      - 9000:9000
    networks:
      - inception-network
    volumes:
      - WordPress:/var/www/html
    depends_on:
      - mariadb
    restart: always

  nginx:
    build: requirements/nginx
    container_name: nginx
    env_file:
      - .env
    ports:
      - 443:443
    volumes:
      - WordPress:/var/www/html
    networks:
      - inception-network
    depends_on:
      - wordpress
    restart: always
  redis:
    container_name: redis
    build: requirements/bonus/redis
    networks:
      - inception-network
    volumes:
      - WordPress:/var/www/html
    env_file:
      - .env
    ports:
      - "6379:6379"
    restart: always
  app:
    build: requirements/bonus/app
    container_name: app
    networks:
      - inception-network
    volumes:
      - ./requirements/bonus/app/tools/src:/usr/share/nginx/html
    ports:
      - "8080:80"
    restart: always
  ftp:
    build: requirements/bonus/ftp
    container_name: ftp
    networks:
      - inception-network
    env_file:
      - .env
    volumes:
      - WordPress:/ftp
    privileged: true
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    restart: always
  adminer:
    build: requirements/bonus/adminer
    container_name: adminer
    networks:
      - inception-network
    env_file:
      - .env
    ports:
      - 8888:8888
    restart: always
  portainer:
    build: requirements/bonus/portainer
    container_name: portainer
    networks:
      - inception-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9001:9000
    restart: always
networks:
  inception-network:
    driver: bridge
    name: inception

volumes:
  DB:
    name: DB
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aes-sarg/data/DB/
  WordPress:
    name: WordPress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aes-sarg/data/WordPress/